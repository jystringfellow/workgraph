description = "Plan, implement, dual-review (correctness/facts and local-first boundaries), and gate without a live tester; use for library, refactor, doc, and fact-covered changes."
gate_when = "all"

[sections.leads.chairs.planner]
part = "planner"
agents = ["claude"]

[sections.leads.chairs.implementer]
part = "implementer"
agents = ["codex", "claude"]

[sections.review.chairs.correctness]
part = "reviewer"
agents = ["copilot", "claude"]
focus = "Correctness, SQLite and migration invariants, edge cases, and facts-first coverage (spec -> failing fact -> minimal implementation); verify no test was weakened."

[sections.review.chairs.boundaries]
part = "reviewer"
agents = ["agy", "claude@large"]
focus = "Local-first privacy, read-only boundaries (no hidden writes or migrations on read paths), untrusted-content gating, path containment, and CLI/help/docs parity."

[sections.leads.chairs.gate]
part = "gate"
agents = ["claude"]

[sections.leads.chairs.classifier]
part = "classifier"
agents = ["claude"]
